spring:
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
        use-default-provider: false
      sqs:
        endpoint: http://localhost:4566
        listener:
          auto-startup: false

  sqs:
    queues:
      order-queue: order-queue
      order-callback-queue: order-callback-queue
      production-queue: production-queue
      production-callback-queue: production-callback-queue
      payment-queue: payment-queue
      payment-callback-queue: payment-callback-queue

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
